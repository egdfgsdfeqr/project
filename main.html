<!doctype html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        h1,
        h2 {
            text-align: center;
            margin-left: 250px;
            color: #EDE6D8;
            opacity: .5;
        }

        h2 {
            position: fixed;
            top: 0;
            right: 10px;
            bottom: 0;
            font-size: medium;
        }

        body {
            background-color: #1C1C1E;
            font-family: Arial, Helvetica, sans-serif;
        }

        #leftBar {
            position: fixed;
            background-color: #2C2C2E;
            top: 0;
            bottom: 0;
            left: 0;
            width: 250px;
        }

        #leftBar p {
            position: fixed;
            color: #EDE6D8;
            opacity: .5;
            font-size: medium;
            text-align: left;
            padding: 5px;
            border: 1px solid#1C1C1E;
            border-radius: 5px;
            width: 200px;
            margin: 10px 10px 10px 10px;
        }

        #taskDisplay {
            text-align: center;
            color: #EDE6D8;
            margin-left: 250px;
            margin-top: 5%;
            right: 50%;
            font-size: larger;
            opacity: .4;
        }

        .parent {
            display: flex;
            margin-left: 250px;
        }

        .parent>div {
            flex: 1;
            margin: 0 10px;
            height: 70vh;
            overflow-y: auto;
        }

        .parent>div::-webkit-scrollbar {
            width: 6px;
        }

        .parent>div::-webkit-scrollbar-track {
            background: transparent;
        }

        .parent>div::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 6px;
        }

        button {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
        }

        #add {
            position: fixed;
            top: 92%;
            left: 96%;
        }

        #AddTaskMenu {
            position: fixed;
            top: 50%;
            left: 55%;
            width: 50%;
            height: 75vh;
            background-color: #2C2C2E;
            color: #EDE6D8;
            border-radius: 10px;
            transform: translate(-50%, -50%);
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            display: none;
        }

        #AddTaskMenu.show {
            display: flex;
        }


        #AddTaskMenu p {
            position: relative;
            bottom: 20%;
            width: 80%;
            margin: 5px 0 0 0;
            font-size: small;
            text-align: left;
        }

        #AddTaskMenu input,
        #AddTaskMenu #grouping {
            position: relative;
            bottom: 20%;
            width: 80%;
            border: 1px solid #888888;
        }

        #AddTaskMenu #createtask,
        #AddTaskMenu #cancel {
            position: relative;
            width: 30%;
            border: none;
            cursor: pointer;
            justify-content: center;
            align-items: center;
        }

        #AddTaskMenu #createtask {
            margin-bottom: 5px;
            background-color: #888888;
        }

        #AddTaskMenu #cancel {
            background-color: #e46767;
        }

        .dropdownoptions {
            position: relative;
            bottom: 20%;
            width: 80%;
            display: none;
        }

        .show {
            display: block;
        }

        .card {
            background-color: #05fcd3;
            font-size: small;
            color: #000000;
        }
    </style>

    <title>Lists For You</title>
</head>

<template id="cardTemplate">

    <div class="card">
        <p class="cardTitle"></p>
        <p class="cardDesc"></p>
        <p class="cardDate"></p>
        <button class="cardDelete">
            <img src="images/delete.png">
        </button>
    </div>
</template>

<body>
    <div>
        <header id="top">
            <h1>Lists For You</h1>
            <h2 id="date">Date: 1/1/26</h2>
        </header>

        <div id="leftBar">
            <p>Search...</p>
        </div>

        <div id="taskDisplay">
            <p id="tempText">Your tasks will appear here...</p>
        </div>

    </div>

    <div class="parent">

        <div id="list1">

        </div>

        <div id="list2">

        </div>

        <div id="list3">
        </div>

    </div>

    <div id="AddTaskMenu" class="hidden">
        <p>Name: (*)</p>
        <input type="text" id="name" placeholder="Enter task name...">
        <p>Description: (*)</p>
        <input type="text" id="description" placeholder="Enter task description..">
        <p>Complete By: (*)</p>
        <input type="date" id="due">
        <p>Select category: (*)</p>
        <button onclick="dropDown()" id="grouping">Select category</button>
        <div id="options" class="dropdownoptions">
            <button onclick="selectcategory('Digital')">Digital</button>
            <button onclick="selectcategory('Home')">Home</button>
            <button onclick="selectcategory('School')">School</button>
            <button onclick="selectcategory('Work')">Work</button>
            <button onclick="selectcategory('Other')">Other</button>
        </div>
        <button id="createtask" onclick="createTask()">Add Task</button>
        <button id="cancel" onclick="hideMenu()">Cancel</button>
    </div>
    <button id="add">
        <img src="Images/add.png" alt="create task">
    </button>

    <script>
        const addTaskButton = document.getElementById("add");
        let categories = ["Home", "Work", "School", "Digital", "Other"];
        let tasks = [];

        // Update and display the date
        function updateDate() {
            const date = new Date();
            document.getElementById("date").innerText = date.toLocaleDateString();
        }
        updateDate();

        // Creates task
        function createTask() {
            const title = document.getElementById("name").value;
            const description = document.getElementById("description").value;
            const due = document.getElementById("due").value;
            const type = document.getElementById("grouping").innerText;

            if (title == "" || description == "" || due == "" || type == "Select category") {
                alert("Please fill in all fields!");
            } else {
                let newTask = {
                    Title: title,
                    Status: "Incomplete",
                    Description: description,
                    Due: due,
                    Type: type,
                };
                tasks.push(newTask);
                saveData(tasks);
                hideMenu();
                displayTask(newTask);
            }
        }

        let cryptographicKey, salt;

        // Create key (AI assisted function)
        async function createKey(pass, salt) {
            const base = await crypto.subtle.importKey(
                "raw",
                new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);

            return crypto.subtle.deriveKey(
                {name: "PBKDF2", salt, iterations: 600000, hash: "SHA-256"},
                base, {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]);
        }

        // Save task (AI assisted function)
        async function saveData(tasks) {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ciphertext = await crypto.subtle.encrypt(
                {name: "AES-GCM", iv: iv},
                cryptographicKey,
                new TextEncoder().encode(JSON.stringify({tasks}))
            );

            localStorage.setItem("listsForYouVault", JSON.stringify({
                salt: Array.from(salt),
                iv: Array.from(iv),
                data: Array.from(new Uint8Array(ciphertext))
            }));
        }

        // Setup cryptography (AI assisted function)
        async function setup() {
            const pass = prompt("Choose a passphrase:");
            salt = crypto.getRandomValues(new Uint8Array(16));
            cryptographicKey = await createKey(pass, salt);
        }

        setup();

        // Displays task
        function displayTask(task) {
            const card = document.getElementById("cardTemplate").content.cloneNode(true);
            card.querySelector(".cardTitle").innerText = `Task: ${task.Title}`;
            card.querySelector(".cardDesc").innerText = `Description: ${task.Description}`;
            card.querySelector(".cardDate").innerText = `Complete By: ${task.Due}`;
            card.querySelector(".cardDelete").onclick = function () {
                deleteTask(task.Title);
            }

            const taskList1 = document.getElementById("list1");
            const taskList2 = document.getElementById("list2");
            const taskList3 = document.getElementById("list3");
            const taskDiv = document.createElement("div");

            const date = new Date();
            date.setHours(0, 0, 0, 0)
            const days = Math.round((new Date(task.Due) - date) / 86400000);

            if (days <= 0) {
                taskList1.appendChild(card);
            } else if (days <= 7) {
                taskList2.appendChild(card);
            } else {
                taskList3.appendChild(card);
            }

            document.getElementById("tempText").innerText = "";
        }

        // Refresh existing tasks
        function redrawTasks() {
            // Clears existing tasks
            document.getElementById("list1").innerHTML = "";
            document.getElementById("list2").innerHTML = "";
            document.getElementById("list3").innerHTML = "";

            for (let i = 0; i < tasks.length; i++) {
                displayTask(tasks[i]);
            }
        }

        // Delete task
        function deleteTask(currentTask) {
            for (let i = 0; i < tasks.length; i++) {
                if (tasks[i].Title == currentTask) {
                    tasks.splice(i, 1);
                    break;
                }
            }
            saveData(tasks);
            redrawTasks();
        }

        // Displays categories 
        function displayCategories() {
            const sidebar = document.getElementById("leftBar");
            sidebar.innerHTML = "";

            for (let i = 0; i < categories.length; i++) {
                const categoryBtn = document.createElement("button");
                categoryBtn.className = "category";
                categoryBtn.onclick = function () {filterByCategory(categories[i]);};
                categoryBtn.innerHTML = `
                    <img src="Images/${categories[i]}.png">
                    <p>${categories[i]}</p>
                `;
                sidebar.appendChild(categoryBtn);
            }
        }
        displayCategories();

        // Filters by category
        function filterByCategory(category) {
            // Clears existing tasks
            document.getElementById("list1").innerHTML = "";
            document.getElementById("list2").innerHTML = "";
            document.getElementById("list3").innerHTML = "";

            for (let i = 0; i < tasks.length; i++) {
                if (tasks[i].Type == category) {
                    displayTask(tasks[i]);
                }
            }
        }

        // Hides the add task menu
        function hideMenu() {
            document.getElementById("AddTaskMenu").classList.remove("show");
        }

        // Displays the 'select category' dropdown
        function dropDown() {
            document.getElementById("options").classList.toggle("show");
        }

        function selectcategory(category) {
            document.getElementById("grouping").innerText = category;
            document.getElementById("options").classList.remove("show");
        }

        // Prompts add task menu
        addTaskButton.addEventListener("click", function () {
            document.getElementById("AddTaskMenu").classList.toggle("show");
        });
    </script>
</body>

</html>
